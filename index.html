<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoldHEN Host | Haider</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #050505;
            color: #f5f5f5;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.13) 0%, transparent 42%),
                radial-gradient(circle at 70% 80%, rgba(184, 150, 46, 0.09) 0%, transparent 42%),
                radial-gradient(circle at 50% 50%, rgba(25, 25, 25, 0.5) 0%, transparent 60%);
            animation: bgMove 20s ease-in-out infinite alternate;
            z-index: -2;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-2%, 3%) scale(1.04); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.025;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 36px 18px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .header {
            text-align: center;
            padding: 6px 0 2px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .logo {
            font-size: 40px;
            font-weight: 700;
            background: linear-gradient(135deg, #f5d76e 0%, #d4af37 45%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1.5px;
        }

        .badge {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #0a0a0a;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 7px;
            letter-spacing: 0.4px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.42);
        }

        .by-line {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 11px;
            padding: 6px 16px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.22);
            border-radius: 50px;
            font-size: 13px;
            color: #d4af37;
            font-weight: 500;
        }

        .glass {
            width: 100%;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .glass::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
        }

        .card-label {
            font-size: 12px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-label span {
            width: 6px;
            height: 6px;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 8px #d4af37;
        }

        .fw-detect {
            background: rgba(0,0,0,0.35);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fw-detect .label {
            color: rgba(255,255,255,0.5);
        }

        .fw-detect .value {
            color: #d4af37;
            font-weight: 600;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #e8c547 0%, #d4af37 50%, #b8860b 100%);
            color: #0a0a0a;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 6px 28px rgba(212, 175, 55, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .btn-main:active { transform: scale(0.975); }
        .btn-main:hover {
            filter: brightness(1.06);
            box-shadow: 0 8px 36px rgba(212, 175, 55, 0.5);
        }
        .btn-main.loading { pointer-events: none; opacity: 0.9; }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-sec {
            padding: 13px 10px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #e5e5e5;
            font-size: 13px;
            font-weight: 550;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-sec:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.3);
            color: #f5d76e;
        }

        .status {
            margin-top: 14px;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.55;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .status.success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.09);
            border: 1px solid rgba(74, 222, 128, 0.22);
        }

        .status.warning {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.09);
            border: 1px solid rgba(251, 191, 36, 0.22);
        }

        .progress-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-top: 14px;
            overflow: hidden;
            display: none;
        }
        .progress-wrap.show { display: block; }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4af37, #f5d76e);
            border-radius: 4px;
            transition: width 0.35s ease;
        }

        .support-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.4);
        }
        .support-box strong { color: #d4af37; font-weight: 600; }

        .info-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.38);
            text-align: center;
            line-height: 1.6;
            margin-top: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 6px;
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.28);
            line-height: 1.7;
        }

        .ig-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 12px;
            padding: 9px 20px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 50px;
            color: #d4af37;
            font-size: 13.5px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .ig-link:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.35);
        }

        .credits {
            margin-top: 10px;
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.2);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10, 10, 10, 0.25);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #f5d76e;
            padding: 13px 24px;
            border-radius: 14px;
            font-size: 13.5px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="logo-row">
                <div class="logo">GoldHEN</div>
                <div class="badge">HOST</div>
            </div>
            <div class="subtitle">PS4 Homebrew Enabler</div>
            <div class="by-line">by Haider</div>
        </div>

        <div class="glass">
            <div class="card-label"><span></span> تشغيل GoldHEN</div>

            <!-- اكتشاف الفيرموير -->
            <div class="fw-detect">
                <span class="label">فيرموير الجهاز</span>
                <span class="value" id="fwValue">جاري الاكتشاف...</span>
            </div>

            <button class="btn-main" id="btnLoad" onclick="startLoad()">
                تشغيل GoldHEN
            </button>

            <div class="btn-row">
                <button class="btn-sec" onclick="cachePayload()">تخزين مؤقت</button>
                <button class="btn-sec" onclick="clearCache()">مسح الكاش</button>
            </div>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="status" id="status">
                جاهز — اضغط تشغيل GoldHEN
            </div>

            <div class="support-box">
                يدعم حتى <strong>13.52</strong>
            </div>
        </div>

        <div class="glass">
            <div class="card-label"><span></span> بايلودات إضافية</div>
            <div class="btn-row">
                <button class="btn-sec" onclick="showToast('BinLoader')">BinLoader</button>
                <button class="btn-sec" onclick="showToast('FTP Server')">FTP</button>
            </div>
            <div class="btn-row" style="margin-top:10px">
                <button class="btn-sec" onclick="showToast('Orbis Toolbox')">Orbis Toolbox</button>
                <button class="btn-sec" onclick="showToast('Disable Updates')">Disable Updates</button>
            </div>
            <p class="info-text">هذه الأزرار جاهزة للربط مع البايلودات الحقيقية</p>
        </div>

        <div class="footer">
            <a href="https://instagram.com/utsx" target="_blank" class="ig-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                @utsx
            </a>
            <div class="credits">
                GoldHEN by SiSTRo • Host UI by Haider<br>
                هذا الموقع للأغراض التعليمية فقط
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let isLoading = false;
        let detectedFW = "غير معروف";

        // محاولة اكتشاف الفيرموير من User-Agent (مثل الهوستات الحقيقية)
        function detectFirmware() {
            const ua = navigator.userAgent || "";
            const fwEl = document.getElementById("fwValue");

            // أمثلة شائعة من متصفح الـ PS4
            // PlayStation 4  ....  Firmware version often appears in UA
            let match = ua.match(/PlayStation 4.*?([0-9]+\.[0-9]+)/i) ||
                        ua.match(/PS4.*?([0-9]+\.[0-9]+)/i) ||
                        ua.match(/([0-9]{1,2}\.[0-9]{2})/);

            if (match && match[1]) {
                detectedFW = match[1];
                fwEl.textContent = detectedFW;
            } else {
                // إذا ما قدر يكتشف (مثلاً على الكمبيوتر)
                detectedFW = "13.52"; // افتراضي للعرض
                fwEl.textContent = "13.52 (تلقائي)";
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        function startLoad() {
            if (isLoading) return;
            isLoading = true;

            const btn = document.getElementById('btnLoad');
            const status = document.getElementById('status');
            const progressWrap = document.getElementById('progressWrap');
            const progressBar = document.getElementById('progressBar');

            btn.classList.add('loading');
            btn.innerHTML = 'جاري التشغيل <span class="spinner"></span>';
            status.className = 'status';
            status.textContent = 'جاري تحميل GoldHEN لفيرموير ' + detectedFW + '...';
            progressWrap.classList.add('show');
            progressBar.style.width = '0%';

            const stages = [
                { p: 18, msg: 'تهيئة WebKit Exploit...' },
                { p: 40, msg: 'تشغيل Kernel Exploit...' },
                { p: 65, msg: 'تحميل GoldHEN Payload...' },
                { p: 88, msg: 'تطبيق الـ Patches...' },
                { p: 100, msg: 'تم بنجاح!' }
            ];

            let stage = 0;
            const interval = setInterval(() => {
                if (stage < stages.length) {
                    progressBar.style.width = stages[stage].p + '%';
                    status.textContent = stages[stage].msg;
                    stage++;
                } else {
                    clearInterval(interval);
                    status.className = 'status success';
                    status.textContent = '✅ تم تشغيل GoldHEN بنجاح على ' + detectedFW;
                    btn.classList.remove('loading');
                    btn.innerHTML = 'تشغيل GoldHEN';
                    isLoading = false;
                    showToast('GoldHEN جاهز ✓');
                    setTimeout(() => {
                        progressWrap.classList.remove('show');
                        progressBar.style.width = '0%';
                    }, 1600);
                }
            }, 650);
        }

        function cachePayload() {
            const status = document.getElementById('status');
            status.className = 'status warning';
            status.textContent = 'جاري تخزين الملفات في الكاش...';
            setTimeout(() => {
                status.className = 'status success';
                status.textContent = '✅ تم التخزين المؤقت — يمكنك قطع الإنترنت';
                showToast('تم التخزين في الكاش');
            }, 1100);
        }

        function clearCache() {
            const status = document.getElementById('status');
            status.className = 'status';
            status.textContent = 'تم مسح الكاش';
            showToast('تم مسح الكاش');
        }

        // تشغيل الاكتشاف عند فتح الصفحة
        window.onload = detectFirmware;

        // ==============================
        // مكان ربط الـ Exploit الحقيقي
        // بعد ما تسوي Fork لـ raw13g
        // حط هنا استدعاء الملفات الحقيقية
        // ==============================
    </script>
</body>
</html>
